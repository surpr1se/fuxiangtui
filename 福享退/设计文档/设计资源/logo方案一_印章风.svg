<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 印章背景 -->
  <rect x="20" y="20" width="160" height="160" rx="8" fill="#C41E3A" />
  <rect x="28" y="28" width="144" height="144" rx="4" fill="none" stroke="#D4AF37" stroke-width="3" />
  
  <!-- 印章内部边框 -->
  <rect x="40" y="40" width="120" height="120" fill="none" stroke="#FFD700" stroke-width="1.5" />
  
  <!-- 主文字：福享退 -->
  <text x="100" y="85" font-family="SimSun, STSong, serif" font-size="36" font-weight="bold" fill="#FFD700" text-anchor="middle">福享退</text>
  
  <!-- 副标题 -->
  <text x="100" y="115" font-family="SimSun, STSong, serif" font-size="14" fill="#FFD700" text-anchor="middle">退休待遇</text>
  
  <!-- 装饰线条 -->
  <line x1="60" y1="130" x2="140" y2="130" stroke="#FFD700" stroke-width="1" />
  
  <!-- 英文 -->
  <text x="100" y="150" font-family="Arial, sans-serif" font-size="11" fill="#FFD700" text-anchor="middle" letter-spacing="2">FU XIANG TUI</text>
  
  <!-- 印章纹理效果 -->
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" />
    <feDisplacementMap in="SourceGraphic" scale="2" />
  </filter>
</svg>
