<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="50%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
  </defs>
  
  <!-- 圆形背景 -->
  <circle cx="100" cy="100" r="90" fill="url(#goldGrad3)"/>
  
  <!-- 铜钱内环 -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="white" stroke-width="3" opacity="0.9"/>
  
  <!-- F字母（融入方孔） -->
  <rect x="80" y="70" width="40" height="60" rx="3" fill="white" opacity="0.95"/>
  <rect x="80" y="70" width="40" height="18" rx="2" fill="url(#goldGrad3)" opacity="0.8"/>
  <rect x="80" y="98" width="25" height="15" rx="2" fill="url(#goldGrad3)" opacity="0.8"/>
  
  <!-- 圆角方孔装饰 -->
  <rect x="88" y="125" width="24" height="24" rx="4" fill="url(#goldGrad3)" opacity="0.6"/>
  
  <!-- 铜钱纹路 -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <circle cx="100" cy="100" r="40" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
</svg>
