<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64B5F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆形背景 -->
  <circle cx="100" cy="100" r="85" fill="url(#blueGradient)" />
  
  <!-- F字母造型 -->
  <path d="M65 60 L100 60 L100 85 L75 85 L75 110 L95 110 L95 130 L75 130 L75 160 L65 160 Z" fill="white" />
  
  <!-- 退休金条图形 -->
  <rect x="105" y="80" width="40" height="8" rx="2" fill="white" opacity="0.9" />
  <rect x="105" y="95" width="32" height="8" rx="2" fill="white" opacity="0.7" />
  <rect x="105" y="110" width="25" height="8" rx="2" fill="white" opacity="0.5" />
  
  <!-- 底部文字 -->
  <text x="100" y="185" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#1E88E5" text-anchor="middle">福享退</text>
</svg>
