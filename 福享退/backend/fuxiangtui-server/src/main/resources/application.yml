server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fuxiangtui?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.fuxiangtui.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      column-format: "`%s`"
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: fuxiangtui-secret-key-2026-fujian-pension-calculator-extended-for-hmac-sha384-compliance
  expiration: 604800000

logging:
  level:
    com.fuxiangtui: debug

wechat:
  mini-program:
    # 推荐通过环境变量配置，避免提交真实密钥
    appid: ${WECHAT_MINI_APPID:}
    app-secret: ${WECHAT_MINI_APP_SECRET:}
