<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 外圈 -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#1F2937" stroke-width="3" />
  
  <!-- 中圈 -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#1F2937" stroke-width="2" opacity="0.7" />
  
  <!-- 内圈填充 -->
  <circle cx="100" cy="100" r="55" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
  
  <!-- 三层保障线 -->
  <line x1="65" y1="85" x2="135" y2="85" stroke="#1F2937" stroke-width="4" stroke-linecap="round" />
  <line x1="75" y1="100" x2="125" y2="100" stroke="#1F2937" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <line x1="85" y1="115" x2="115" y2="115" stroke="#1F2937" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  
  <!-- 中心圆点 -->
  <circle cx="100" cy="100" r="5" fill="#1F2937" />
  
  <!-- 底部文字 -->
  <text x="100" y="185" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle" letter-spacing="8">福享退</text>
</svg>
