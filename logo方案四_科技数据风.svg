<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆角矩形背景 -->
  <rect x="30" y="35" width="140" height="130" rx="10" fill="url(#techGradient)" />
  
  <!-- 数据图表：柱状图 -->
  <g fill="white">
    <rect x="50" y="125" width="15" height="30" rx="2" opacity="0.9" />
    <rect x="75" y="110" width="15" height="45" rx="2" opacity="0.8" />
    <rect x="100" y="95" width="15" height="60" rx="2" opacity="0.85" />
    <rect x="125" y="85" width="15" height="70" rx="2" opacity="0.95" />
  </g>
  
  <!-- 趋势线 -->
  <path d="M57 125 L82 110 L107 95 L132 85" stroke="#FFD54F" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <!-- 计算符号 -->
  <circle cx="100" cy="65" r="15" fill="white" opacity="0.2" />
  <text x="100" y="71" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">∑</text>
  
  <!-- 底部文字区域 -->
  <rect x="30" y="165" width="140" height="25" fill="#1565C0" rx="0" />
  <text x="100" y="182" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">福享退 · 精准测算</text>
</svg>
