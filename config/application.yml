server:
  port: 8080

spring:
  application:
    name: fuxiangtui-pension-server

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/fuxiangtui?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

  # JSON配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.fuxiangtui.pension.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置
logging:
  level:
    com.fuxiangtui: debug
    org.springframework: info

# 微信小程序配置：生产环境建议通过环境变量注入
wechat:
  miniapp:
    appid: ${WECHAT_MINIAPP_APPID:wx147701ec13bed81b}
    secret: ${WECHAT_MINIAPP_SECRET:7d5890af4fb6ed1407e219fe57c772eb}
